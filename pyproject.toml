[project]
name = "cybersecurity-identity-access"
version = "0.1.0"
description = "Edukacyjna aplikacja webowa do zarządzania tożsamością i dostępem."
requires-python = ">=3.13,<3.14"
dependencies = [
    "django[argon2]>=5.2,<5.3",
    "python-dotenv>=1.0,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-django>=4.0,<5.0",
    "ruff>=0.14,<1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
addopts = ["--ds=config.settings.test", "--strict-config", "--strict-markers", "-ra"]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
faulthandler_timeout = 30

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = [".tools", ".cache", ".uv-cache", ".vscode"]
force-exclude = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "RUF100"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
