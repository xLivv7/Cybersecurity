name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install pinned Python
        run: uv python install

      - name: Synchronize locked dependencies
        run: uv sync --locked --dev

      - name: Check code
        run: uv run --locked ruff check .

      - name: Check formatting
        run: uv run --locked ruff format --check .

      - name: Check Django configuration
        run: uv run --locked python manage.py check --settings=config.settings.test

      - name: Check migrations
        run: uv run --locked python manage.py makemigrations --check --dry-run --noinput --settings=config.settings.test

      - name: Run tests
        run: uv run --locked pytest
